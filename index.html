<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lottomatch Bestellung</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mut:#6b7280;--ac:#1f6feb;--ok:#1a9d4a;--bad:#d93025;--bd:#d8dce3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#1b2029;--tx:#f1f3f6;--mut:#9aa3b2;--ac:#4c8dff;--ok:#38c172;--bad:#ff6b5e;--bd:#2c3340}}
:root[data-theme="dark"]{--bg:#101319;--card:#1b2029;--tx:#f1f3f6;--mut:#9aa3b2;--ac:#4c8dff;--ok:#38c172;--bad:#ff6b5e;--bd:#2c3340}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;user-select:none}
.tabs{display:flex;gap:8px;padding:8px}
.tabs button{flex:1;padding:14px 4px;font-size:16px;font-weight:700;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{flex:1;overflow-y:auto;padding:0 8px 8px}
h2{margin:14px 4px 6px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:19px;overflow-wrap:anywhere}
.nm span{color:var(--mut);font-size:15px}
.btn{width:72px;height:72px;border-radius:16px;border:0;font-size:40px;font-weight:700;color:#fff;line-height:1}
.minus{background:var(--bad)}.plus{background:var(--ok)}
.btn:active{transform:scale(.94);filter:brightness(.9)}
.cnt{min-width:44px;text-align:center;font-size:34px;font-weight:800}
.cnt.z{color:var(--mut);font-weight:500}
footer{background:var(--card);border-top:2px solid var(--bd);padding:10px 10px 12px}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tot div{font-size:15px;color:var(--mut)}
.tot strong{display:block;font-size:40px;color:var(--tx);line-height:1.1}
.acts{display:flex;gap:8px;margin-top:8px}
.acts button{flex:1;min-height:60px;font-size:17px;font-weight:700;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);padding:6px}
.acts .mode.on{background:var(--ac);border-color:var(--ac);color:#fff}
.acts .pay{background:var(--ok);border-color:var(--ok);color:#fff}
.acts .yel{background:#f5b800;border-color:#f5b800;color:#14181f}
.acts .rst{background:var(--bad);border-color:var(--bad);color:#fff}
.hint{font-size:14px;color:var(--mut);margin:6px 4px}
.ed{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.ed input{font-size:18px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);min-width:0;user-select:text}
.ed .n{flex:1}.ed .p{width:92px}
.ed select{font-size:16px;padding:12px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.ed button{width:60px;height:56px;border-radius:12px;border:0;background:var(--bad);color:#fff;font-size:24px}.ed .mv{background:var(--ac)}.ed select{flex:1}
.add{width:100%;min-height:60px;font-size:18px;font-weight:700;border-radius:14px;border:2px dashed var(--ac);background:transparent;color:var(--ac);margin-top:6px}
.wl{font-size:13px;color:var(--mut);text-align:center;padding:2px}
.pu{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:12px}
.puh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.puh b{font-size:28px}.puh span{color:var(--mut);font-size:15px}
.lbl{width:100%;font-size:18px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:8px;user-select:text}
.pl{font-size:22px;padding:14px 8px;border-radius:10px;border:1px solid var(--bd);margin-bottom:6px}
.pl .q{font-weight:800}
.pl.dn{text-decoration:line-through;color:var(--mut);opacity:.55}
.done{width:100%;min-height:64px;margin-top:4px;font-size:19px;font-weight:700;border:0;border-radius:14px;background:var(--ok);color:#fff}
</style>
</head>
<body>
<div class="tabs">
  <button id="t1" class="on" data-tab="1">Bestellung</button>
  <button id="t3" data-tab="3">Abholliste</button>
  <button id="t2" data-tab="2">Preise</button>
</div>
<main id="main"></main>
<footer id="foot"></footer>
<div class="wl" id="wl"></div>

<script>
(function(){
var KEY="lottomatch_v1";
var def=[
 {id:1,n:"Bratwurst mit Brot",p:9,c:"M"},{id:2,n:"Wienerli mit Brot",p:7,c:"M"},{id:3,n:"Wurstsalat",p:13,c:"M"},
 {id:4,n:"Schüblig mit Kartoffelsalat",p:14,c:"M"},{id:5,n:"Toast Schinken-Käse",p:7,c:"M"},{id:6,n:"Kuchen",p:4,c:"M"},
 {id:7,n:"Mineral",p:3.5,c:"G"},{id:8,n:"Süssgetränk",p:4,c:"G"},{id:9,n:"Bier 3 dl",p:4.5,c:"G"},{id:10,n:"Bier 5 dl",p:6,c:"G"},
 {id:11,n:"Wein 1 dl",p:4.5,c:"G"},{id:12,n:"Wein Flasche",p:28,c:"G"},{id:13,n:"Kaffee",p:3.5,c:"G"},{id:14,n:"Kaffee Schnaps",p:6,c:"G"}
];
var items=def, counts={}, pick={}, single=false, tab=1, armed=false, armT=null, pu=[], armP=null, armPT=null, made=false, cur=null, listed={};

try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.items&&s.items.length){items=s.items;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({items:items}));}catch(e){}}
try{var q=JSON.parse(localStorage.getItem(KEY+"_pu")||"[]");if(q&&q.length)pu=q;}catch(e){}
function savePU(){try{localStorage.setItem(KEY+"_pu",JSON.stringify(pu));}catch(e){}}
function calcMade(){
  var p=false,a=false;
  items.forEach(function(i){var t=(counts[i.id]||0)+(pick[i.id]||0),L=listed[i.id]||0;if(t>L)p=true;if(L>0)a=true;});
  made=a&&!p;
}
function touch(id,dl){
  var tot=(counts[id]||0)+(pick[id]||0),it=find(id);
  if(dl<0&&it&&tot<(listed[id]||0)){
    for(var k=pu.length-1;k>=0;k--){
      var ln=null;
      pu[k].l.forEach(function(x){if(x.n===it.n&&(x.c==="M")===(it.c==="M"))ln=x;});
      if(ln){ln.q--;pu[k].sum-=it.p;if(ln.q<=0)pu[k].l.splice(pu[k].l.indexOf(ln),1);if(!pu[k].l.length)pu.splice(k,1);break;}
    }
    listed[id]=tot;savePU();
  }
  calcMade();render();
}
function adj(id,dl){
  if(!cur)return;
  var it=find(id),o=null,ln=null;
  pu.forEach(function(x){if(x.id===cur)o=x;});
  if(!o||!it)return;
  o.l.forEach(function(x){if(x.n===it.n&&(x.c==="M")===(it.c==="M"))ln=x;});
  if(dl>0){if(ln){ln.q++;ln.d=0;}else{o.l.push({q:1,n:it.n,d:0,c:it.c});}o.sum+=it.p;}
  else if(ln){ln.q--;o.sum-=it.p;if(ln.q<=0)o.l.splice(o.l.indexOf(ln),1);}
  if(!o.l.length){pu=pu.filter(function(x){return x!==o;});cur=null;made=false;}
  savePU();render();
}
function chf(x){return (Math.round(x*100)/100).toFixed(2);}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function sum(o){var t=0;items.forEach(function(i){t+=(o[i.id]||0)*i.p;});return t;}
function rowHTML(i){
  var c=counts[i.id]||0, k=pick[i.id]||0;
  var extra=single&&k?'<span> · bei Person: '+k+'</span>':'';
  return '<div class="row"><div class="nm"><b>'+esc(i.n)+'</b><span>CHF '+chf(i.p)+'</span>'+extra+'</div>'+
   '<button class="btn minus" data-a="m" data-id="'+i.id+'">−</button>'+
   '<div class="cnt'+(c?'':' z')+'">'+c+'</div>'+
   '<button class="btn plus" data-a="p" data-id="'+i.id+'">+</button></div>';
}
function renderMain(){
  var h="",M=items.filter(function(i){return i.c==="M";}),G=items.filter(function(i){return i.c!=="M";});
  if(M.length){h+="<h2>Menü</h2>"+M.map(rowHTML).join("");}
  if(G.length){h+="<h2>Getränke</h2>"+G.map(rowHTML).join("");}
  if(!items.length){h='<p class="hint">Keine Artikel. Im Tab „Preise“ hinzufügen.</p>';}
  document.getElementById("main").innerHTML=h;
  renderFoot();
}
function renderFoot(){
  var f=document.getElementById("foot");
  if(tab!==1){f.style.display="none";return;}
  f.style.display="";
  var h='<div class="tot">';
  if(single){
    h+='<div>Person zahlt<strong style="color:var(--ok)">CHF '+chf(sum(pick))+'</strong></div><div style="text-align:right">Noch offen<strong>CHF '+chf(sum(counts))+'</strong></div>';
  }else{
    h+='<div>Total<strong>CHF '+chf(sum(counts))+'</strong></div>';
  }
  h+='</div><div class="acts"><button class="mode'+(single?' on':'')+'" data-a="mode">Einzeln zahlen: '+(single?'AN':'AUS')+'</button>';
  h+='<button class="'+(made?'pay':'yel')+'" data-a="topu">'+(made?'Abholliste erstellt ✓':'Abholliste erstellen')+'</button>';
  h+='<button class="rst" data-a="reset">'+(armed?'Sicher? Nochmal tippen':'Zurücksetzen')+'</button></div>';
  if(single){h+='<div class="acts"><button class="pay" data-a="paid">Person bezahlt</button></div><div class="hint">Minus: Artikel zur Person verschieben. Plus: zurück in die offene Bestellung.</div>';}
  f.innerHTML=h;
}
function renderEdit(){
  var h='<p class="hint">Name und Preis anpassen, mit ▲ ▼ sortieren. Änderungen erscheinen sofort im Tab „Bestellung“.</p>';
  [["M","Menü"],["G","Getränke"]].forEach(function(g){
    h+='<h2>'+g[1]+'</h2>';
    items.filter(function(i){return (i.c==="M")===(g[0]==="M");}).forEach(function(i){
      h+='<div class="ed" style="margin-bottom:6px"><input class="n" data-f="n" data-id="'+i.id+'" value="'+esc(i.n)+'">'+
      '<input class="p" data-f="p" data-id="'+i.id+'" inputmode="decimal" value="'+chf(i.p)+'"></div>'+
      '<div class="ed" style="margin-bottom:16px"><select data-f="c" data-id="'+i.id+'"><option value="M"'+(i.c==="M"?' selected':'')+'>Menü</option><option value="G"'+(i.c!=="M"?' selected':'')+'>Getränk</option></select>'+
      '<button class="mv" data-a="up" data-id="'+i.id+'">▲</button><button class="mv" data-a="dn" data-id="'+i.id+'">▼</button>'+
      '<button data-a="del" data-id="'+i.id+'">✕</button></div>';
    });
  });
  h+='<button class="add" data-a="add">+ Artikel hinzufügen</button>';
  document.getElementById("main").innerHTML=h;
  renderFoot();
}
function renderPU(){
  var h="";
  if(!pu.length){h='<p class="hint">Keine offenen Abholungen. Im Tab „Bestellung“ mit „Abholliste erstellen“ hinzufügen.</p>';}
  pu.forEach(function(o){
    h+='<div class="pu"><div class="puh"><b>#'+o.num+'</b><span>'+o.t+' · CHF '+chf(o.sum)+'</span></div>';
    [["M","Menü"],["G","Getränke"]].forEach(function(g){
      var has=false;
      o.l.forEach(function(x,k){
        if((x.c==="M")!==(g[0]==="M"))return;
        if(!has){has=true;h+='<h2 style="margin:8px 4px 6px">'+g[1]+'</h2>';}
        h+='<div class="pl'+(x.d?' dn':'')+'" data-a="tick" data-pid="'+o.id+'" data-k="'+k+'"><span class="q">'+x.q+'×</span> '+esc(x.n)+'</div>';
      });
      if(has){h+='<button class="done" data-a="fin" data-pid="'+o.id+'" data-part="'+g[0]+'">'+(armP===String(o.id)+g[0]?'Sicher? Nochmal tippen':(g[0]==="M"?'Menüzettel Küche überreicht ✓':'Getränke abgeholt ✓'))+'</button>';}
    });
    h+='</div>';
    
  });
  document.getElementById("main").innerHTML=h;
  renderFoot();
}
function render(){
  document.getElementById("t3").textContent="Abholliste"+(pu.length?" ("+pu.length+")":"");
  tab===1?renderMain():tab===2?renderEdit():renderPU();
}
function find(id){for(var j=0;j<items.length;j++){if(items[j].id==id)return items[j];}}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-tab],[data-a]");if(!b)return;
  if(b.dataset.tab){
    tab=+b.dataset.tab;
    document.getElementById("t1").className=tab===1?"on":"";
    document.getElementById("t2").className=tab===2?"on":"";
    document.getElementById("t3").className=tab===3?"on":"";
    render();return;
  }
  var a=b.dataset.a,id=b.dataset.id;
  if(a==="p"){
    if(single){if(pick[id]>0){pick[id]--;counts[id]=(counts[id]||0)+1;}}
    else{counts[id]=(counts[id]||0)+1;touch(id,1);}
    renderMain();
  }else if(a==="m"){
    if(single){if(counts[id]>0){counts[id]--;pick[id]=(pick[id]||0)+1;}}
    else if(counts[id]>0){counts[id]--;touch(id,-1);}
    renderMain();
  }else if(a==="mode"){
    if(single){ // zurück: Person-Artikel wieder in offene Bestellung
      for(var k in pick){counts[k]=(counts[k]||0)+pick[k];}pick={};
    }
    single=!single;renderMain();
  }else if(a==="paid"){Object.keys(pick).forEach(function(k){listed[k]=Math.max(0,(listed[k]||0)-pick[k]);});pick={};calcMade();renderMain();}
  else if(a==="topu"){
    var l=[],s=0;
    items.forEach(function(i){var tot=(counts[i.id]||0)+(pick[i.id]||0),q=tot-(listed[i.id]||0);if(q>0){l.push({q:q,n:i.n,d:0,c:i.c});s+=q*i.p;}});
    if(!l.length||made)return;
    var mx=0;pu.forEach(function(o){if(o.num>mx)mx=o.num;});
    var dt=new Date();
    pu.push({id:Date.now(),num:mx+1,t:("0"+dt.getHours()).slice(-2)+":"+("0"+dt.getMinutes()).slice(-2),sum:s,lbl:"",l:l});
    items.forEach(function(i){listed[i.id]=(counts[i.id]||0)+(pick[i.id]||0);});savePU();made=true;render();
  }
  else if(a==="tick"){
    pu.forEach(function(o){if(o.id==b.dataset.pid){var x=o.l[+b.dataset.k];x.d=x.d?0:1;}});
    savePU();renderPU();
  }
  else if(a==="fin"){
    var pid=b.dataset.pid,part=b.dataset.part,key=pid+part;
    if(armP!==key){armP=key;clearTimeout(armPT);armPT=setTimeout(function(){armP=null;if(tab===3)renderPU();},3000);}
    else{armP=null;pu.forEach(function(o){if(o.id==pid)o.l=o.l.filter(function(x){return (x.c==="M")!==(part==="M");});});pu=pu.filter(function(o){return o.l.length;});if(cur&&!pu.some(function(o){return o.id===cur;})){cur=null;made=false;}savePU();}
    render();
  }
  else if(a==="reset"){
    if(!armed){armed=true;renderFoot();clearTimeout(armT);armT=setTimeout(function(){armed=false;renderFoot();},3000);}
    else{armed=false;clearTimeout(armT);counts={};pick={};single=false;made=false;cur=null;listed={};renderMain();}
  }else if(a==="up"||a==="dn"){
    var ix=items.indexOf(find(id)),d=a==="up"?-1:1,cat=items[ix].c==="M",j=ix+d;
    while(j>=0&&j<items.length&&(items[j].c==="M")!==cat)j+=d;
    if(j>=0&&j<items.length){var tmp=items[ix];items[ix]=items[j];items[j]=tmp;save();}
    renderEdit();
  }else if(a==="add"){
    var nid=Date.now();items.push({id:nid,n:"Neuer Artikel",p:0,c:"G"});save();renderEdit();
  }else if(a==="del"){
    items=items.filter(function(i){return i.id!=id;});delete counts[id];delete pick[id];save();renderEdit();
  }
});
document.addEventListener("input",function(e){
  var t=e.target,f=t.dataset.f;if(!f)return;
  if(f==="lbl"){pu.forEach(function(o){if(o.id==t.dataset.pid)o.lbl=t.value;});savePU();return;}
  var it=find(t.dataset.id);if(!it)return;
  if(f==="n")it.n=t.value;
  else if(f==="p"){var v=parseFloat(String(t.value).replace(",","."));it.p=isNaN(v)?0:v;}
  else if(f==="c")it.c=t.value;
  save();
});
document.addEventListener("change",function(e){
  if(e.target.dataset&&e.target.dataset.f==="p"){e.target.value=chf(find(e.target.dataset.id).p);}
});

// Bildschirm wach halten
var lock=null;
function wake(){
  var el=document.getElementById("wl");
  try{
    if(navigator.wakeLock){
      navigator.wakeLock.request("screen").then(function(l){lock=l;el.textContent="Bildschirm bleibt an";l.addEventListener("release",function(){el.textContent="";});}).catch(function(){el.textContent="Bildschirm-Sperre: in den Handy-Einstellungen Display-Timeout verlängern";});
    }else{el.textContent="Bildschirm-Sperre: in den Handy-Einstellungen Display-Timeout verlängern";}
  }catch(err){}
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")wake();});
document.addEventListener("click",function(){if(!lock||lock.released)wake();});
wake();
render();
})();
</script>
</body>
</html>
